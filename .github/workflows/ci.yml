name: CI
on: [push, pull_request]
jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: foundry-rs/foundry-toolchain@v1
      - run: forge test -vv
        working-directory: contracts
      - name: live testnet scan (fork)
        # Required: fails if the live scan disagrees. Retries only cover public-RPC hiccups.
        run: |
          for i in 1 2 3; do
            forge test --match-path test/fork/LiveScan.t.sol --fork-url https://evm-testnet.qore.host -vv && exit 0
            echo "attempt $i failed, retrying"; sleep 20
          done
          exit 1
        working-directory: contracts
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci && npm run build
        working-directory: web
